# Default values for toggl-pg-mirror.
# This is a YAML-formatted file.

app:
  image:
    repository: ghcr.io/stephane-klein/toggl-pg-mirror
    tag: latest
    pullPolicy: Always

  replicaCount: 1

# PostgreSQL connection — the app connects to an existing CloudNativePG cluster
# via a connection URL built from the copied CNPG secret.
postgresql:
  schema: public

# CloudNativePG cluster configuration
cnpg:
  clusterName: memex
  # Namespace where the CNPG cluster lives. Used to construct the full hostname.
  # The secret's "host" field contains a short service name (e.g. memex-cluster-rw)
  # that only resolves within its own namespace. The deployment template appends
  # ".{{ .Values.cnpg.namespace }}" so the connection URL works across namespaces:
  #   <host>.<namespace>  →  memex-cluster-rw.memex
  # This follows standard Kubernetes DNS: <service>.<namespace>.svc.cluster.local
  namespace: memex
  # Name of the secret CNPG creates for application access.
  # The secret keys are: host, port, dbname, username, password, jdbc-uri, pgpass.
  secretName: memex-app
  # Name of the copied secret in the target namespace (populated by ESO or manually).
  copySecretName: memex-app

# Single Kubernetes Secret holding all application secrets (Toggl API token,
# admin token, SMTP password, MCP reader PostgreSQL password). Create it
# manually in the target namespace:
#   kubectl create secret generic toggl-pg-mirror \
#     -n toggl-pg-mirror \
#     --from-literal=toggl-token=YOUR_TOGGL_API_TOKEN \
#     --from-literal=admin-token=YOUR_ADMIN_TOKEN_AT_LEAST_32_CHARS \
#     --from-literal=smtp-password=YOUR_SMTP_PASSWORD \
#     --from-literal=mcp-reader-postgres-password=YOUR_MCP_READER_POSTGRES_PASSWORD
existingSecret:
  name: toggl-pg-mirror
  togglTokenKey: toggl-token
  adminTokenKey: admin-token
  smtpPassKey: smtp-password
  mcpReaderPostgresPasswordKey: mcp-reader-postgres-password

# Read-only MCP server — exposes time_entries over SQL to AI agents.
# The reader PostgreSQL role is created at app startup with SELECT-only
# privileges when the password (existingSecret.mcpReaderPostgresPasswordKey)
# is set. If the key is absent, the MCP read-only access is disabled.
mcp:
  # PostgreSQL role name used for read-only MCP access.
  readerRole: toggl_mcp_reader
  # Cap on the number of characters returned by the readOnlySqlQuery and
  # searchTags tools, so a large result does not flood the AI agent's context.
  # maxOutputChars is the hard server-side ceiling; defaultMaxOutputChars is
  # applied when a tool call does not pass maxCharacters.
  maxOutputChars: 200000
  defaultMaxOutputChars: 50000

# SMTP configuration for outgoing emails (e.g. the send-test-mail admin endpoint).
# The password is read from the existingSecret (smtpPassKey).
smtp:
  host: ""
  port: 587
  secure: false
  user: ""
  from: noreply@example.com
  # Default recipient for the send-test-mail admin endpoint
  testTo: ""

# HTTP server (SvelteKit adapter-node)
port: 3000

# Ingress — expose the HTTP service externally
ingress:
  enabled: false
  host: []
  path: /
  className: ""
  annotations: {}
  tls: []

# External Secrets Operator — copies the CNPG app secret from the source
# namespace (e.g. memex) to the release namespace automatically.
# Requires ClusterSecretStore + ClusterExternalSecret CRDs (ESO installed).
# Disable if you copy secrets manually instead.
eso:
  enabled: true
  # Name of the ClusterSecretStore to create.
  clusterSecretStoreName: kubernetes-cnpg-memex
  # When using the kubernetes provider without explicit auth, ESO uses
  # its own service account. The operator must have RBAC to read secrets
  # in the source namespace (cnpg.namespace).

# Resource limits
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Node selector, tolerations, affinity (optional)
nodeSelector: {}
tolerations: []
affinity: {}
