# Pin esrap to 2.3.4: 2.3.3 emits invalid JavaScript for JSDoc-annotated
# parameters (e.g. `(/** @type {any} */ (reject))`), which breaks the remote
# functions runtime with "SyntaxError: Invalid destructuring assignment target".
# Fixed in 2.3.4 — see https://github.com/sveltejs/esrap/issues/164.
overrides:
  esrap: 2.3.4
