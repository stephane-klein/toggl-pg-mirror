name: Build and push container image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build"
        required: false
        default: "main"

env:
  IMAGE: ghcr.io/stephane-klein/toggl-pg-mirror

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Compute build args
        id: build_args
        run: |
          echo "git_hash=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "git_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git show -s --format=%ci)" >> "$GITHUB_OUTPUT"
          echo "build_stamp=$(TZ=Europe/Paris date '+%Y-%m-%d_%H:%M:%S-%Z')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            GIT_HASH=${{ steps.build_args.outputs.git_hash }}
            GIT_BRANCH=${{ steps.build_args.outputs.git_branch }}
            GIT_DATE=${{ steps.build_args.outputs.git_date }}
            BUILD_STAMP=${{ steps.build_args.outputs.build_stamp }}
